name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile everything (catches syntax errors)
        run: python -m compileall -q main.py modules
      - name: Import every module (catches import-time errors, no API keys needed)
        run: |
          python - << 'PYEOF'
          import sys, importlib
          sys.path.insert(0, "modules")
          mods = [
              "env_config", "github_scraper", "instagram_scraper",
              "identity_scanner", "breach_checker", "analyzer",
              "exposure_scorer", "ai_analyst",
          ]
          for m in mods:
              importlib.import_module(m)
              print(f"ok: {m}")
          PYEOF
