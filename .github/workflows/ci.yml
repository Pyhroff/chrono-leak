name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile everything (catches syntax errors)
        run: python -m compileall -q main.py modules
      - name: Check for undefined names (compileall does not catch these)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 main.py modules tests
      - name: Import every module (catches import-time errors, no API keys needed)
        run: |
          python - << 'PYEOF'
          import sys, importlib
          sys.path.insert(0, "modules")
          mods = [
              "env_config", "github_scraper", "instagram_scraper",
              "identity_scanner", "breach_checker", "analyzer",
              "exposure_scorer", "ai_analyst",
          ]
          for m in mods:
              importlib.import_module(m)
              print(f"ok: {m}")
          PYEOF
