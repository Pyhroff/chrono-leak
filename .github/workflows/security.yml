name: Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q main.py modules
      - name: Check for dangerous source constructs
        run: |
          ! grep -RInE '(^|[^A-Za-z_])(eval|exec|os\.system)\s*\(' main.py modules --include='*.py'
          ! grep -RIn 'shell=True' main.py modules --include='*.py'
